server:
  # Render (and most PaaS) inject the port to bind. Fall back to 8080 locally.
  port: ${PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: flopay-backend
  profiles:
    # `dev` permits the local Vite origin. Deployments must override this
    # (SPRING_PROFILES_ACTIVE=prod).
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    # No default — deliberately. `${VAR:?message}` is bash syntax, not a
    # Spring property placeholder; Spring has no "required" form, only
    # `${key:default}` where everything after the colon is a literal default
    # value. Leaving this genuinely unset means Spring's own placeholder
    # resolution fails with "Could not resolve placeholder 'DATABASE_URL'",
    # which at least names the missing variable. Point it at a real Postgres
    # instance — the ledger needs Postgres's real row locking
    # (SELECT ... FOR UPDATE) to prevent a wallet going negative under
    # concurrent debits, and H2's semantics differ enough that "it passed
    # locally" against H2 would not mean anything. A free Neon/Supabase
    # project is enough for dev; see README.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns every table. Hibernate is only allowed to check that the
      # entities match what Flyway created — never to alter schema itself.
      # For a ledger, an auto-migration silently widening or narrowing a
      # column is not an acceptable way to find out about a mismatch.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

flopay:
  jwt:
    # This repository is public, so the real secret can never live here.
    # Deployments must set FLOPAY_JWT_SECRET — JwtService refuses to start on
    # this dev default unless the dev profile is active.
    secret: ${FLOPAY_JWT_SECRET:dev-only-insecure-jwt-secret-never-deploy-this-32bytes+}
    expiry-minutes: ${FLOPAY_JWT_EXPIRY_MINUTES:120}
  cors:
    # Comma-separated origin patterns allowed to call the API.
    allowed-origins: ${FLOPAY_ALLOWED_ORIGINS:http://localhost:*}

logging:
  level:
    com.flopay: INFO
