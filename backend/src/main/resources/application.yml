server:
  port: 8080

spring:
  application:
    name: flopay-backend
  datasource:
    url: jdbc:h2:mem:flopay;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

flopay:
  jwt:
    # Demo-only secret. In a real deployment this comes from an env var / secrets manager.
    secret: "flopay-dev-jwt-signing-secret-change-me-please-32bytes+"
    expiry-minutes: 120

logging:
  level:
    com.flopay: INFO
