# Render Blueprint — deploys the FloPay backend as a Docker web service.
#
# The frontend is NOT here; it deploys to Vercel (see apps/gateway-web/vercel.json).
#
# After the first deploy you must set these values in the Render dashboard:
#   FLOPAY_JWT_SECRET       generated for you below, but verify it exists
#   FLOPAY_ALLOWED_ORIGINS  your Vercel URLs (gateway-web AND consumer-app) —
#                           the API rejects unlisted origins
#   FLOPAY_WEBAUTHN_RP_ID   consumer-app's bare domain (no scheme/port), e.g.
#                           flopay-wallet.vercel.app — passkey login is scoped
#                           to this exact origin
#   FLOPAY_WEBAUTHN_ORIGINS consumer-app's full origin(s), e.g.
#                           https://flopay-wallet.vercel.app
services:
  - type: web
    name: flopay-api
    runtime: docker
    dockerfilePath: ./apps/gateway-api/Dockerfile
    dockerContext: ./apps/gateway-api
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      # Disables the H2 console and enforces the real JWT secret. Do not set this
      # to "dev" on a public host.
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Render generates a random value and keeps it out of the repo. The service
      # refuses to start without a non-default secret.
      - key: FLOPAY_JWT_SECRET
        generateValue: true

      # Comma-separated origin patterns. Replace with your deployed frontend, e.g.
      #   https://flopay.vercel.app,https://flopay-*.vercel.app
      # The wildcard entry covers Vercel preview deployments.
      - key: FLOPAY_ALLOWED_ORIGINS
        sync: false

      - key: FLOPAY_JWT_EXPIRY_MINUTES
        value: "120"

      - key: FLOPAY_JWT_REFRESH_EXPIRY_DAYS
        value: "30"

      # Both required for passkey login to work in production — see the note
      # above. Left unset, WebAuthn falls back to the "localhost" dev default
      # and every real login attempt fails with an origin mismatch (OTP login
      # is unaffected either way).
      - key: FLOPAY_WEBAUTHN_RP_ID
        sync: false

      - key: FLOPAY_WEBAUTHN_ORIGINS
        sync: false
